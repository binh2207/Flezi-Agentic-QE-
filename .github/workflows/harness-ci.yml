name: Harness CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: playwright-automation-framework/package-lock.json

      - name: Install Playwright dependencies
        working-directory: playwright-automation-framework
        run: npm ci

      - name: Install Chromium
        working-directory: playwright-automation-framework
        run: npx playwright install --with-deps chromium

      - name: Configure BASE_URL
        working-directory: playwright-automation-framework
        run: cp .env.example .env

      - name: Typecheck
        working-directory: playwright-automation-framework
        run: npx tsc --noEmit

      - name: Run tests (placeholders skip)
        working-directory: playwright-automation-framework
        run: npm test

      - name: Verify Playwright MCP package
        run: npm run setup:mcp && npm run verify:mcp
